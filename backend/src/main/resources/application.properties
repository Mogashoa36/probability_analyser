spring.application.name=bet-analyzer

# --- Default: in-memory H2 so the app runs out of the box ---
spring.datasource.url=jdbc:h2:mem:betdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=always
# Run data.sql AFTER Hibernate creates the schema, not before.
spring.jpa.defer-datasource-initialization=true

# Port 8081, not the Spring default 8080: on this machine a local Apache/httpd
# already holds 8080, so booting on 8080 dies with "Port 8080 was already in use".
# 8081 is also what frontend/proxy.conf.json points its /api proxy at, so the two
# match out of the box. Override for any other port with --server.port=NNNN, and
# update proxy.conf.json to match.
server.port=8081

# --- External data (real fixtures and results) ---
# Nothing is fetched on boot; syncs are always an explicit POST to /api/sync/*.
app.sync.enabled=true
app.sync.provider=sofascore

# Time zone used to turn the provider's UTC kick-off instants into the local
# times shown in the UI. Blank = the server's own zone.
app.sync.zone=

# Competitions pulled by POST /api/sync/competitions, as id:Name.
# SofaScore tournament ids: 7 Champions League, 8 La Liga, 17 Premier League,
# 23 Serie A, 35 Bundesliga, 39 South African Premier Division.
app.sync.competitions[0]=17:Premier League
app.sync.competitions[1]=8:La Liga
app.sync.competitions[2]=23:Serie A
app.sync.competitions[3]=35:Bundesliga
app.sync.competitions[4]=39:PSL

# Leave the base URL blank to pick automatically: the official API host when an
# API key is set, otherwise the keyless public endpoint. Set it explicitly only
# for a proxy, a mirror, or a local stub.
#   official : https://api.sofascore.com/api/v1   (needs a key - the supported route)
#   public   : https://www.sofascore.com/api/v1   (no key, but returns HTTP 403 to
#                                                  anything that is not a browser,
#                                                  which includes most servers/CI)
app.sync.sofascore.base-url=
app.sync.sofascore.api-key=
app.sync.sofascore.default-league=Football
app.sync.sofascore.connect-timeout-ms=8000
app.sync.sofascore.read-timeout-ms=20000

# --- To use PostgreSQL instead, comment out the H2 block above and use: ---
# spring.datasource.url=jdbc:postgresql://localhost:5432/betanalyzer
# spring.datasource.driver-class-name=org.postgresql.Driver
# spring.datasource.username=postgres
# spring.datasource.password=postgres
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
