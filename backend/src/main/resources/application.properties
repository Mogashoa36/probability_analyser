spring.application.name=bet-analyzer

# --- Default: in-memory H2 so the app runs out of the box ---
spring.datasource.url=jdbc:h2:mem:betdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=always
# Run data.sql AFTER Hibernate creates the schema, not before.
spring.jpa.defer-datasource-initialization=true

server.port=8080

# --- To use PostgreSQL instead, comment out the H2 block above and use: ---
# spring.datasource.url=jdbc:postgresql://localhost:5432/betanalyzer
# spring.datasource.driver-class-name=org.postgresql.Driver
# spring.datasource.username=postgres
# spring.datasource.password=postgres
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
